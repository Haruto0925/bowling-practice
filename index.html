<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="練習ノート" />
<meta name="theme-color" content="#0b3d91" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<script src="firebase-config.js"></script>
<title>ボウリング練習ノート</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --primary:#0b3d91;
    --primary-2:#1657c9;
    --accent:#ff6b1a;
    --danger:#d93025;
    --success:#1e8e3e;
    --lane:#d97706;
    --text:#111827;
    --sub:#6b7280;
    --border:#e5e7eb;
    --stripe:#f9fafb;
    --shadow:0 4px 14px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    font-size:16px;line-height:1.5;
    padding-top:env(safe-area-inset-top);
  }
  header{
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;padding:14px 16px;
    position:sticky;top:0;z-index:20;
    box-shadow:var(--shadow);
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
  header h1 .emoji{font-size:22px}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}
  main{padding:12px 12px 96px 12px;max-width:720px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
  h2{font-size:17px;margin:0 0 10px 0;color:var(--primary);border-left:5px solid var(--primary);padding-left:8px}
  h3{font-size:15px;margin:12px 0 6px;color:#374151}
  label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;padding:12px;font-size:16px;border:1px solid var(--border);
    border-radius:10px;background:#fff;font-family:inherit;
  }
  input[type=number]{ -moz-appearance:textfield }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0 }
  .row{display:flex;gap:8px;align-items:center}
  .row > *{flex:1}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:14px 16px;border:none;border-radius:12px;
    font-size:16px;font-weight:700;color:#fff;background:var(--primary);
    cursor:pointer;min-height:48px;width:100%;
  }
  .btn.accent{background:var(--accent)}
  .btn.danger{background:var(--danger)}
  .btn.gray{background:#6b7280}
  .btn.ghost{background:#fff;color:var(--primary);border:2px solid var(--primary)}
  .btn.sm{padding:8px 10px;font-size:13px;min-height:36px;width:auto}
  .btn:active{transform:scale(.98)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{background:var(--stripe);border-radius:12px;padding:10px;text-align:center}
  .stat .num{font-size:24px;font-weight:800;color:var(--primary);line-height:1.2}
  .stat .lbl{font-size:11px;color:var(--sub)}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#eef2ff;color:var(--primary);margin-right:4px}
  .tag.venue{background:#fff4e6;color:#c2410c}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
  th{background:var(--stripe);color:#374151;font-weight:600}
  .small{font-size:12px;color:var(--sub)}
  .center{text-align:center}
  .empty{padding:24px;text-align:center;color:var(--sub);font-size:14px;border:2px dashed var(--border);border-radius:12px}
  .list{list-style:none;margin:0;padding:0}
  .list li{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--border)}
  .list li:last-child{border-bottom:none}
  .grow{flex:1;min-width:0}
  /* 下部タブ */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:#fff;border-top:1px solid var(--border);
    display:flex;max-width:720px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs button{
    flex:1;border:none;background:none;padding:8px 2px 10px;
    font-size:11px;color:var(--sub);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;
  }
  nav.tabs button .ic{font-size:20px}
  nav.tabs button.on{color:var(--primary)}
  /* スコアチップ */
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .chip{background:#eef2ff;color:var(--primary);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;min-width:34px;text-align:center}
  .chip.best{background:#fff4e6;color:#c2410c}
  .chip-tap{cursor:pointer;border-bottom:2px dashed var(--primary-2)}
  /* フレーム内訳テーブル */
  .frames-detail{margin-top:6px}
  .frames-table-wrap{overflow-x:auto}
  .frames-table{font-size:11px;border-collapse:collapse;background:#fff}
  .frames-table th,.frames-table td{padding:3px 4px;min-width:22px;border:1px solid var(--border);text-align:center}
  .frames-table th{background:var(--stripe);font-size:10px}
  /* 上達バッジ */
  .badge-up{display:inline-flex;align-items:center;gap:4px;background:#e6f4ea;color:var(--success);font-weight:800;border-radius:999px;padding:4px 12px;font-size:15px}
  .badge-down{display:inline-flex;align-items:center;gap:4px;background:#fce8e6;color:var(--danger);font-weight:800;border-radius:999px;padding:4px 12px;font-size:15px}
  .badge-flat{display:inline-flex;align-items:center;gap:4px;background:#f3f4f6;color:var(--sub);font-weight:800;border-radius:999px;padding:4px 12px;font-size:15px}
  /* 会場カード */
  .venue-card{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
  .venue-card .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .venue-card .name{font-weight:800;font-size:15px}
  .venue-card .avg{font-size:22px;font-weight:800;color:var(--lane)}
  .bar-outer{background:#f3f4f6;border-radius:999px;height:10px;overflow:hidden;margin-top:6px}
  .bar-inner{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lane),#f59e0b)}
  .diff-pos{color:var(--success);font-weight:700}
  .diff-neg{color:var(--danger);font-weight:700}
  /* ゲーム入力行 */
  .game-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .game-row .gno{flex:0 0 44px;font-weight:700;color:var(--sub);font-size:14px}
  .game-row input{flex:1}
  .game-row .rm{flex:0 0 auto;border:none;background:#f3f4f6;color:var(--danger);border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer}
  .hidden{display:none !important}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .filter-row button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
  .filter-row button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
  .divider{height:1px;background:var(--border);margin:14px 0}
  svg text{font-family:inherit}
  /* フレーム入力 */
  .frame-strip{display:flex;gap:3px;overflow-x:auto;padding:4px 0 2px}
  .fr-box{flex:0 0 auto;width:52px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
  .fr-box.fr10{width:72px}
  .fr-no{background:var(--stripe);font-size:10px;font-weight:700;color:var(--sub);text-align:center;padding:2px 0}
  .fr-inputs{display:flex}
  .fr-inputs input{flex:1;min-width:0;border:none;border-left:1px solid var(--border);border-radius:0;padding:8px 2px;font-size:15px;text-align:center}
  .fr-inputs input:first-child{border-left:none}
  .fr-inputs input:disabled{background:#f3f4f6;color:#d1d5db}
  .frame-marks{display:flex;gap:3px;overflow-x:auto;padding:0 0 2px}
  .fr-mark{flex:0 0 auto;width:52px;text-align:center;font-size:12px;font-weight:700;color:var(--primary);min-height:16px}
  .fr-box.fr10 + .fr-mark, .frame-marks .fr-mark:last-child{width:72px}
  /* かんたん入力パッド */
  .frame-pad{margin-top:10px;background:var(--stripe);border-radius:12px;padding:10px}
  .frame-pad-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .fp-btn{border:none;border-radius:12px;padding:10px 4px;font-size:20px;font-weight:800;line-height:1.1;cursor:pointer;min-height:56px;color:#fff}
  .fp-btn span{font-size:10px;font-weight:600;display:block;margin-top:2px}
  .fp-g{background:#6b7280}
  .fp-s{background:var(--success)}
  .fp-x{background:var(--accent)}
  .fp-c{background:#9ca3af}
  .fp-btn:active{transform:scale(.96)}
  /* モーダル(会場情報編集) */
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
</style>
</head>
<body>
<header>
  <h1><span class="emoji">🎳</span>ボウリング練習ノート</h1>
  <div class="sub">みんなの練習記録と上達度・会場別スコア傾向</div>
  <div class="sub" id="sync-status">接続準備中…</div>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-tab="home" class="on"><span class="ic">🏠</span>ホーム</button>
  <button data-tab="record"><span class="ic">📝</span>きろく</button>
  <button data-tab="plans"><span class="ic">📅</span>よてい</button>
  <button data-tab="analysis"><span class="ic">📈</span>ぶんせき</button>
  <button data-tab="admin"><span class="ic">⚙️</span>かんり</button>
</nav>

<script>
"use strict";
// ---------- ボウリング スコア計算(正規ルール) ----------
// frames: 10フレームの配列。1-9Fは [t1, t2?]、10Fは [t1, t2?, t3?]。未入力は undefined/null
function calcGame(frames){
  const throws = [];
  let complete = true;
  for(let f=0; f<10; f++){
    const fr = frames[f] || [];
    const validFr = fr.filter(p=>p!==null && p!==undefined);
    const need = f<9 ? (validFr[0]===10 ? 1 : 2) : ((validFr[0]===10 || (validFr.length>=2 && validFr[0]+validFr[1]===10)) ? 3 : 2);
    if(validFr.length < need) complete = false;
    for(const p of fr){
      if(p===null || p===undefined) continue;
      throws.push({pins:p, frame:f});
    }
  }
  let score = 0;
  const cum = [];
  let strikes=0, spares=0, opens=0;
  for(let f=0; f<10; f++){
    const fr = frames[f] || [];
    const valid = fr.filter(p=>p!==null && p!==undefined);
    if(valid.length===0){ cum.push(null); continue; }
    if(f<9){
      if(valid[0]===10){
        strikes++;
        const bonus = throws.filter(t=>t.frame>f).slice(0,2);
        const need2 = bonus.length>=2;
        score += 10 + (need2? bonus.reduce((a,t)=>a+t.pins,0) : 0);
        cum.push(need2? score : null);
      }else{
        const sum = valid.slice(0,2).reduce((a,p)=>a+p,0);
        if(valid.length>=2 && sum===10){
          spares++;
          const bonus = throws.filter(t=>t.frame>f).slice(0,1);
          score += 10 + (bonus.length? bonus[0].pins : 0);
          cum.push(bonus.length? score : null);
        }else if(valid.length>=2){
          opens++;
          score += sum;
          cum.push(score);
        }else{
          cum.push(null);
        }
      }
    }else{
      if(valid[0]===10) strikes++;
      else if(valid.length>=2 && valid[0]+valid[1]===10) spares++;
      else if(valid.length>=2) opens++;
      score += valid.reduce((a,p)=>a+p,0);
      cum.push(score);
    }
  }
  return {total: cum[cum.length-1] ?? 0, cum, complete, strikes, spares, opens};
}

// ---------- ユーティリティ ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const fmt1 = v => (Math.round(v*10)/10).toFixed(1);
const todayStr = () => {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};

// ---------- DB(表示用のローカルキャッシュ) ----------
const DB = {
  key:"bowling_practice_v2",
  data:{ members:[], venues:[], sessions:[], plans:[] },
  load(){
    try{
      const raw = localStorage.getItem(this.key);
      if(raw) this.data = Object.assign({members:[],venues:[],sessions:[],plans:[]}, JSON.parse(raw));
    }catch(e){ console.warn(e); }
  },
  save(){ localStorage.setItem(this.key, JSON.stringify(this.data)); }
};
DB.load();

// ---------- クラウド同期レイヤー ----------
// mode: 'local' (端末内保存のみ) / 'cloud' (Firestoreリアルタイム共有)
const Sync = { mode:"local", db:null, fs:null };

// 追加: 新しいidを返す
async function fsAdd(coll, obj){
  if(Sync.mode==="cloud"){
    const ref = await Sync.fs.addDoc(Sync.fs.collection(Sync.db, coll), obj);
    return ref.id;
  }
  const id = uid();
  DB.data[coll].push({id, ...obj});
  DB.save();
  return id;
}
// 更新
async function fsSet(coll, id, patch){
  if(Sync.mode==="cloud"){
    await Sync.fs.updateDoc(Sync.fs.doc(Sync.db, coll, id), patch);
    return;
  }
  const it = DB.data[coll].find(x=>x.id===id);
  if(it) Object.assign(it, patch);
  DB.save();
}
// 削除
async function fsDel(coll, id){
  if(Sync.mode==="cloud"){
    await Sync.fs.deleteDoc(Sync.fs.doc(Sync.db, coll, id));
    return;
  }
  DB.data[coll] = DB.data[coll].filter(x=>x.id!==id);
  DB.save();
}
// バッチ書き込み(450件チャンク)。items: [{coll, data}]
async function fsBatchAdd(items){
  if(Sync.mode==="cloud"){
    for(let i=0;i<items.length;i+=450){
      const b = Sync.fs.writeBatch(Sync.db);
      for(const it of items.slice(i,i+450)){
        const ref = Sync.fs.doc(Sync.fs.collection(Sync.db, it.coll));
        b.set(ref, it.data);
        if(it.localEcho) it.localEcho.id = ref.id;
      }
      await b.commit();
    }
    return;
  }
  for(const it of items){
    DB.data[it.coll].push({id:uid(), ...it.data});
  }
  DB.save();
}

// Firebase 接続(設定があればクラウドモードへ)
async function initCloudSync(){
  const el = document.getElementById("sync-status");
  const cfg = window.FIREBASE_CONFIG;
  const isConfigured = cfg && cfg.apiKey && !String(cfg.apiKey).startsWith("ここに");
  if(!isConfigured){
    if(el) el.textContent = "📱 ローカルモード(この端末のみ保存)";
    return;
  }
  try{
    const appMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    const fsMod  = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
    const auMod  = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
    const app = appMod.initializeApp(cfg);
    const db  = fsMod.getFirestore(app);
    try{
      await auMod.signInAnonymously(auMod.getAuth(app));
    }catch(e){
      console.warn("匿名認証に失敗(認証なしルールなら動作します):", e);
    }
    Sync.mode = "cloud"; Sync.db = db; Sync.fs = fsMod;
    if(el) el.textContent = "☁️ クラウド共有モード — みんなの記録がリアルタイムで集まります";
    // 3コレクションをリアルタイム購読
    for(const coll of ["members","venues","sessions","plans"]){
      fsMod.onSnapshot(fsMod.collection(db, coll), snap=>{
        const rows = [];
        snap.forEach(d=> rows.push(Object.assign({id:d.id}, d.data())));
        DB.data[coll] = rows;
        DB.save(); // オフライン用キャッシュ
        // きろくタブで入力中は画面を書き換えない(入力が消えるのを防ぐ)
        if(currentTab !== "record") render();
      }, err=>{
        console.error(err);
        if(el) el.textContent = "⚠️ クラウド接続エラー — キャッシュを表示中";
      });
    }
  }catch(e){
    console.warn("Firebase初期化に失敗:", e);
    if(el) el.textContent = "📱 ローカルモード(Firebase接続失敗)";
  }
}

const memberName = id => (DB.data.members.find(m=>m.id===id)||{}).name || "（削除済み）";
const venueName  = id => (DB.data.venues.find(v=>v.id===id)||{}).name || "（削除済み）";

// 全ゲームを時系列で平坦化 {date, createdAt, memberId, venueId, score, gameNo, sessionId}
function allGames(){
  const rows = [];
  for(const s of DB.data.sessions){
    (s.games||[]).forEach((g,i)=>{
      if(g==null || g==="") return;
      rows.push({date:s.date, createdAt:s.createdAt||0, memberId:s.memberId, venueId:s.venueId, score:Number(g), gameNo:i+1, sessionId:s.id});
    });
  }
  rows.sort((a,b)=> a.date===b.date ? (a.createdAt-b.createdAt || a.gameNo-b.gameNo) : (a.date<b.date?-1:1));
  return rows;
}

// ---------- タブ ----------
let currentTab = "home";
let analysisMember = "all"; // 'all' or memberId
const tabsEl = $("#tabs");
tabsEl.addEventListener("click", e=>{
  const b = e.target.closest("button[data-tab]");
  if(!b) return;
  currentTab = b.dataset.tab;
  [...tabsEl.querySelectorAll("button")].forEach(x=>x.classList.toggle("on", x===b));
  render();
});

function render(){
  const app = $("#app");
  if(currentTab==="home") app.innerHTML = viewHome();
  else if(currentTab==="record"){ app.innerHTML = viewRecord(); initGameRows(); }
  else if(currentTab==="plans"){ app.innerHTML = viewPlans(); }
  else if(currentTab==="analysis"){ app.innerHTML = viewAnalysis(); drawCharts(); }
  else if(currentTab==="admin") app.innerHTML = viewAdmin();
}

// ==================== ホーム ====================
function viewHome(){
  const games = allGames();
  const totalGames = games.length;
  const avg = totalGames ? games.reduce((a,g)=>a+g.score,0)/totalGames : 0;
  const best = totalGames ? Math.max(...games.map(g=>g.score)) : 0;
  const monthKey = todayStr().slice(0,7);
  const monthGames = games.filter(g=>g.date.startsWith(monthKey)).length;

  const recent = DB.data.sessions.slice().sort((a,b)=> b.date===a.date ? (b.createdAt||0)-(a.createdAt||0) : (a.date<b.date?1:-1)).slice(0,5);

  let recentHtml;
  if(!recent.length){
    recentHtml = `<div class="empty">まだ記録がありません。<br>「📝 きろく」タブから最初の練習を記録しましょう！</div>`;
  }else{
    recentHtml = `<ul class="list">` + recent.map(s=>{
      const gs = (s.games||[]).filter(g=>g!==null&&g!=="").map(Number);
      const a = gs.length ? gs.reduce((x,y)=>x+y,0)/gs.length : 0;
      const mx = gs.length ? Math.max(...gs) : 0;
      return `<li>
        <div class="grow">
          <div><b>${esc(memberName(s.memberId))}</b> <span class="tag venue">📍${esc(venueName(s.venueId))}</span></div>
          <div class="small">${esc(s.date)} ・ ${gs.length}G ・ 平均 ${fmt1(a)}</div>
          <div class="chips">${gs.map(g=>`<span class="chip${g===mx&&gs.length>1?" best":""}">${g}</span>`).join("")}</div>
        </div>
      </li>`;
    }).join("") + `</ul>`;
  }

  // メンバー別 上達サマリー(直近5G - 最初の5G)
  const improv = DB.data.members.map(m=>{
    const gs = games.filter(g=>g.memberId===m.id);
    const w = Math.min(5, Math.floor(gs.length/2));
    if(gs.length < 6) return null;
    const early = gs.slice(0,w), late = gs.slice(-w);
    const ea = early.reduce((a,g)=>a+g.score,0)/w;
    const la = late.reduce((a,g)=>a+g.score,0)/w;
    return {name:m.name, diff:la-ea, n:gs.length};
  }).filter(Boolean).sort((a,b)=>b.diff-a.diff).slice(0,3);

  return `
  <div class="card">

// フレーム内訳の表示/非表示(記録一覧)
let openDetail = {sid:null, gi:null};
function toggleFrames(sid, gi){
  const box = document.getElementById("fd-"+sid);
  if(!box) return;
  if(openDetail.sid===sid && openDetail.gi===gi && !box.classList.contains("hidden")){
    box.classList.add("hidden"); openDetail={sid:null,gi:null}; return;
  }
  const s = DB.data.sessions.find(x=>x.id===sid);
  const d = s && s.gamesDetail && s.gamesDetail[gi];
  if(!d){ return; }
  openDetail = {sid, gi};
  document.querySelectorAll(".frames-detail").forEach(x=>x.classList.add("hidden"));
  box.innerHTML = framesDetailHtml(d, gi);
  box.classList.remove("hidden");
}

// ---------- 入力方式: 合計スコア / フレームごと ----------
let inputMode = "score"; // 'score' | 'frames'
let frameGames = [];     // [{frames: [[t1,t2],...10frames], score, complete}]
let frameGameCount = 1;

function setInputMode(mode, keep){
  inputMode = mode;
  const s = $("#mode-score"), f = $("#mode-frames");
  if(s) s.classList.toggle("on", mode==="score");
  if(f) f.classList.toggle("on", mode==="frames");
  const se = $("#score-entry"), fe = $("#frame-entry");
  if(se) se.classList.toggle("hidden", mode!=="score");
  if(fe) fe.classList.toggle("hidden", mode!=="frames");
  if(mode==="frames" && !keep) renderFrameEntry();
}

function initFrameEntry(){
  if(!frameGames.length) frameGames = [newFrameGame()];
  renderFrameEntry();
}
function newFrameGame(){
  return {frames: Array.from({length:10}, ()=>[]), score:null, complete:false};
}

function renderFrameEntry(){
  const fe = $("#frame-entry");
  if(!fe) return;
  fe.innerHTML = frameGames.map((g,gi)=>frameGameHtml(g,gi)).join("") +
    (frameGames.length<5
      ? `<button class="btn gray sm" onclick="addFrameGame()">＋ ゲームを追加(フレーム入力)</button>` : "");
  // ボタンパッドを最下部に追加
  fe.innerHTML += framePadHtml();
  // イベント設定: inputで逐次反応し、focusinで「最後に触った欄」を確実に記録
  fe.querySelectorAll("input[data-g]").forEach(inp=>{
    inp.addEventListener("input", onFrameInput);
    inp.addEventListener("focusin", ()=>{
      lastFrameTarget = {gi:Number(inp.dataset.g), f:Number(inp.dataset.f), t:Number(inp.dataset.t)};
    });
  });
}

// ガーター/スペア/ストライクの専用ボタンパッド
// 「最後にフォーカス/入力した欄」を確実に追跡して、そこに値を入れる
let lastFrameTarget = null; // {gi, f, t}
function framePadHtml(){
  return `<div class="frame-pad">
    <div class="small" style="margin-bottom:4px">かんたん入力(欄をタップして選んでから押す):</div>
    <div class="frame-pad-btns">
      <button type="button" class="fp-btn fp-g" ontouchend="padPress(0);event.preventDefault()" onclick="padPress(0)">G<br><span>ガーター</span></button>
      <button type="button" class="fp-btn fp-s" ontouchend="padPress('spare');event.preventDefault()" onclick="padPress('spare')">/<br><span>スペア</span></button>
      <button type="button" class="fp-btn fp-x" ontouchend="padPress(10);event.preventDefault()" onclick="padPress(10)">X<br><span>ストライク</span></button>
      <button type="button" class="fp-btn fp-c" ontouchend="padPress('clear');event.preventDefault()" onclick="padPress('clear')">C<br><span>クリア</span></button>
    </div>
  </div>`;
}
function padPress(kind){
  // 対象欄の解決: 最後に触った欄 → それがなければ最初の空き欄
  let target = null;
  if(lastFrameTarget){
    target = document.querySelector(`input[data-g="${lastFrameTarget.gi}"][data-f="${lastFrameTarget.f}"][data-t="${lastFrameTarget.t}"]`);
    // disabledになっていたら無効
    if(target && target.disabled) target = null;
  }
  if(!target){
    target = document.querySelector('#frame-entry input[data-g]:not([disabled])');
  }
  if(!target) return;
  const gi = Number(target.dataset.g), f = Number(target.dataset.f), t = Number(target.dataset.t);
  const g = frameGames[gi];
  const fr = g.frames[f];
  const has = i => fr[i]!==undefined && fr[i]!==null;
  if(kind==="clear"){
    target.value = "";
    fr[t] = undefined;
  }else if(kind===0){ // ガーター
    target.value = "0";
    fr[t] = 0;
  }else if(kind===10){ // ストライク
    target.value = "10";
    fr[t] = 10;
    if(f<9 && t===0) fr[1] = undefined;
  }else if(kind==="spare"){ // スペア(2投目以降): 残りピンを自動計算
    if(t>=1 && has(t-1)){
      const rest = 10 - fr[t-1];
      if(rest<0) return;
      target.value = String(rest);
      fr[t] = rest;
    }else{ return; }
  }
  lastFrameTarget = {gi,f,t};
  // change と同じ後処理を呼ぶ
  onFrameInput({target});
}

function frameGameHtml(g, gi){
  const calc = calcGame(g.frames);
  const marks = g.frames.map((fr,f)=>{
    return `<div class="fr-mark">${frameMark(fr,f)}</div>`;
  }).join("");
  const stat = calc.complete
    ? `<span class="tag hd" style="background:#e6f4ea;color:var(--success)">確定 ${calc.total}点</span>
       <span class="small">X${calc.strikes} / ${calc.spares}</span>`
    : `<span class="small">途中: ${calc.cum.filter(c=>c!==null).slice(-1)[0] ?? "-"}点</span>`;
  return `<div class="venue-card" style="margin-bottom:12px">
    <div class="head">
      <div class="name">${gi+1}ゲーム目</div>
      <div style="display:flex;gap:6px;align-items:center">
        ${stat}
        ${frameGames.length>1?`<button class="rm" onclick="delFrameGame(${gi})" style="border:none;background:#f3f4f6;color:var(--danger);border-radius:8px;width:30px;height:30px;cursor:pointer">✕</button>`:""}
      </div>
    </div>
    <div class="frame-strip">${g.frames.map((fr,f)=>frameInputsHtml(fr,gi,f)).join("")}</div>
    <div class="frame-marks">${marks}</div>
    ${frameError(g) ? `<div class="small" style="color:var(--danger);margin-top:4px">${frameError(g)}</div>` : ""}
  </div>`;
}

function frameInputsHtml(fr, gi, f){
  const is10 = f===9;
  const cells = is10?3:2;
  let html = `<div class="fr-box${is10?" fr10":""}"><div class="fr-no">${f+1}</div><div class="fr-inputs">`;
  for(let t=0;t<cells;t++){
    const v = fr[t];
    html += `<input type="number" min="0" max="10" inputmode="numeric" data-g="${gi}" data-f="${f}" data-t="${t}" value="${v===undefined||v===null?"":v}" ${frameInputDisabled(fr,f,t)?"disabled":""}>`;
  }
  html += `</div></div>`;
  return html;
}

// 入力を無効化するか(ストライク後の2投目など)
function frameInputDisabled(fr, f, t){
  if(f<9){
    if(t===1 && fr[0]===10) return true; // ストライク後は2投目なし
    if(t===1 && (fr[0]===undefined||fr[0]===null)) return false;
    return false;
  }
  // 10F
  if(t===1) return fr[0]===undefined||fr[0]===null;
  if(t===2){
    if(fr[0]===10) return fr[1]===undefined||fr[1]===null ? false : false; // 1投目Xなら2投目から有効
    return !(fr[0]!==undefined && fr[0]!==null && fr[1]!==undefined && fr[1]!==null && fr[0]+fr[1]===10);
  }
  return false;
}

// フレームの表示マーク
function frameMark(fr, f){
  const v = i => fr[i];
  const has = i => fr[i]!==undefined && fr[i]!==null;
  const X = "X", SP = "/";
  if(f<9){
    if(has(0) && v(0)===10) return X;
    if(has(0) && has(1)){
      if(v(0)+v(1)===10) return `${v(0)||"-"}${SP}`;
      return `${v(0)} ${v(1)}`;
    }
    if(has(0)) return `${v(0)}`;
    return "";
  }
  // 10F
  let s = "";
  if(has(0)) s += v(0)===10?X:v(0);
  if(has(1)){
    if(v(0)===10) s += v(1)===10?" X":" "+v(1);
    else s += v(0)+v(1)===10?SP:" "+v(1);
  }
  if(has(2)) s += v(2)===10?" X":" "+v(2);
  return s;
}

// バリデーション(エラーメッセージ or null)
function frameError(g){
  for(let f=0; f<10; f++){
    const fr = g.frames[f];
    const has = i => fr[i]!==undefined && fr[i]!==null;
    if(f<9){
      if(has(0) && has(1) && fr[0]!==10 && fr[0]+fr[1]>10) return `${f+1}フレーム: 2投の合計は10以下にしてください`;
    }else{
      if(has(0) && has(1) && fr[0]!==10 && fr[0]+fr[1]>10) return `10フレーム: 1・2投目の合計は10以下にしてください`;
      if(has(1) && has(2) && fr[0]===10 && fr[1]!==10 && fr[1]+fr[2]>10) return `10フレーム: 2・3投目の合計は10以下にしてください`;
    }
    for(let t=0;t<fr.length;t++){
      if(has(t) && (fr[t]<0 || fr[t]>10)) return `${f+1}フレーム: 0〜10で入力してください`;
    }
  }
  return null;
}

function onFrameInput(e){
  const inp = e.target;
  const gi = Number(inp.dataset.g), f = Number(inp.dataset.f), t = Number(inp.dataset.t);
  let v = inp.value===""? null : Math.round(Number(inp.value));
  if(v!==null){ v = Math.max(0, Math.min(10, v)); }
  lastFrameTarget = {gi,f,t};
  const g = frameGames[gi];
  g.frames[f][t] = v===null? undefined : v;
  // 1-9Fでストライクなら2投目を消す
  if(f<9 && t===0 && v===10){ g.frames[f][1] = undefined; }
  // 「1」の直後に「0」で「10」を作れるよう、値が1桁で「1」のときは次へ進まない
  // (inputイベントで逐次反応するための誤移動防止)
  const raw = inp.value;
  const holdAdvance = (raw === "1");  // 「10」を打つ途中かもしれないので待つ
  // 再描画(フォーカス保持のため部分更新: マークとステータスのみ)
  const card = inp.closest(".venue-card");
  const calc = calcGame(g.frames);
  // マーク更新
  const marks = card.querySelectorAll(".fr-mark");
  marks.forEach((m,i)=> m.textContent = frameMark(g.frames[i], i));
  // ステータス更新
  const head = card.querySelector(".head div:last-child");
  if(head){
    const stat = calc.complete
      ? `<span class="tag hd" style="background:#e6f4ea;color:var(--success)">確定 ${calc.total}点</span>
         <span class="small">X${calc.strikes} / ${calc.spares}</span>`
      : `<span class="small">途中: ${calc.cum.filter(c=>c!==null).slice(-1)[0] ?? "-"}点</span>`;
    const delBtn = head.querySelector(".rm");
    head.innerHTML = stat;
    if(delBtn) head.appendChild(delBtn);
  }
  // ストライク等でdisabled状態が変わるので入力欄を更新(フォーカス中以外)
  card.querySelectorAll("input[data-g]").forEach(i2=>{
    const nf = Number(i2.dataset.f), nt = Number(i2.dataset.t);
    const dis = frameInputDisabled(g.frames[nf], nf, nt);
    i2.disabled = dis;
    if(dis && i2!==inp) i2.value = "";
  });
  // エラー表示
  const err = frameError(g);
  let errEl = card.querySelector(".frame-err");
  if(err){
    if(!errEl){ errEl = document.createElement("div"); errEl.className="frame-err small"; errEl.style.cssText="color:var(--danger);margin-top:4px"; card.appendChild(errEl); }
    errEl.textContent = err;
  }else if(errEl){ errEl.remove(); }
  // 自動で次の入力欄へ(値が入った時のみ)
  if(v!==null && !holdAdvance) focusNextFrameInput(gi, f, t, g);
}

// 次に入力すべきマスへフォーカスを移す
function focusNextFrameInput(gi, f, t, g){
  const fr = g.frames[f];
  const has = i => fr[i]!==undefined && fr[i]!==null;
  let next = null;
  if(f < 9){
    if(t===0){
      if(fr[0]===10){ next = {f:f+1, t:0}; }        // ストライク → 次フレーム1投目
      else { next = {f:f, t:1}; }                    // → 2投目
    } else { next = {f:f+1, t:0}; }                  // 2投目 → 次フレーム1投目
  }else{ // 10F
    if(t===0){ next = {f:f, t:1}; }
    else if(t===1){
      const canThird = fr[0]===10 || (has(0)&&has(1)&&fr[0]+fr[1]===10);
      next = canThird ? {f:f, t:2} : null;           // ボーナスなければ終了
    }
    else next = null;                                 // 3投目 → 終了
  }
  if(next && next.f<=9){
    const sel = `input[data-g="${gi}"][data-f="${next.f}"][data-t="${next.t}"]`;
    const el = document.querySelector(sel);
    if(el && !el.disabled){
      // 次のターゲットを記録してからフォーカス(ボタン操作にも追従するため)
      lastFrameTarget = {gi, f:next.f, t:next.t};
      setTimeout(()=>{ el.focus(); el.select && el.select(); }, 60);
      return;
    }
  }
  // ゲーム完了時はキーボードを閉じる
  if(!next && f===9){
    const calc2 = calcGame(g.frames);
    if(calc2.complete){
      const inp = document.activeElement;
      if(inp && inp.blur) inp.blur();
    }
  }
}

async function saveSession(){
  const memberId = $("#r-member").value;
  const venueId = $("#r-venue").value;
  const date = $("#r-date").value || todayStr();
  const memo = $("#r-memo").value.trim();
  if(!memberId){ alert("メンバーを選択してください"); return; }
  if(!venueId){ alert("会場を選択してください (未登録なら「＋会場」から追加)"); return; }
  let games = [];
  let gamesDetail = null;
  if(inputMode === "score"){
    games = [...$("#game-rows").querySelectorAll("input")].map(i=>i.value).filter(v=>v!=="").map(v=>{
      const n = Math.round(Number(v));
      return (isNaN(n)||n<0)?0:Math.min(300,n);
    });
    if(!games.length){ alert("スコアを1ゲーム以上入力してください"); return; }
  }else{
    // フレーム入力モード: 完全なゲームのみ保存対象
    const completeOnes = [];
    const errors = [];
    frameGames.forEach((g, gi)=>{
      const err = frameError(g);
      if(err){ errors.push(`${gi+1}ゲーム目: ${err}`); return; }
      const calc = calcGame(g.frames);
      if(calc.complete) completeOnes.push({calc, frames:g.frames});
    });
    if(errors.length){ alert(errors.join("\n")); return; }
    if(!completeOnes.length){ alert("最後のフレームまで入力が完了したゲームがありません。\n10フレーム目まで入力してください。"); return; }
    games = completeOnes.map(c=>c.calc.total);
    gamesDetail = completeOnes.map(c=>({
      score: c.calc.total,
      strikes: c.calc.strikes,
      spares: c.calc.spares,
      opens: c.calc.opens,
      // Firestoreはネストした配列を保存できないため、文字列に変換 (例: "10,-,-|9,0")
      framesStr: c.frames.map(fr=>{
        const arr = [fr[0], fr[1], fr[2]].map(p=> (p===undefined||p===null)? "-" : String(p));
        return arr.join(",");
      }).join("|")
    }));
  }
  try{
    const doc = {date, memberId, venueId, games, memo, createdAt:Date.now()};
    if(gamesDetail) doc.gamesDetail = gamesDetail;
    await fsAdd("sessions", doc);
  }catch(e){
    console.error("save error:", e);
    const msg = (e && e.code) ? `${e.code}: ${e.message||""}` : String(e);
    alert("保存に失敗しました。\n原因: " + msg.slice(0,200) + "\n\nこの画面をスクショして報告してください。");
    return;
  }
  gameCount = 3;
  frameGames = [newFrameGame()];
  inputMode = "score";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
async function delSession(id){
  if(!confirm("この記録を削除しますか?")) return;
  await fsDel("sessions", id);
  render();
}

function viewAnalysis(){
  const games = allGames();
  if(!games.length){
    return `<div class="card"><h2>📈 ぶんせき</h2><div class="empty">記録がまだありません。<br>練習を記録すると、ここに上達度や会場別の傾向が表示されます。</div></div>`;
  }
  const filterBtns = [`<button data-m="all" class="${analysisMember==="all"?"on":""}" onclick="setAnalysisMember('all')">全員</button>`]
    .concat(DB.data.members.slice().sort((a,b)=>a.name.localeCompare(b.name,"ja"))
      .map(m=>`<button data-m="${m.id}" class="${analysisMember===m.id?"on":""}" onclick="setAnalysisMember('${m.id}')">${esc(m.name)}</button>`))
    .join("");

  const target = analysisMember==="all" ? games : games.filter(g=>g.memberId===analysisMember);
  const label = analysisMember==="all" ? "全員" : memberName(analysisMember);

  // ストライク/スペア率の集計(詳細記録があるゲームのみ)
  function calcRates(gameRows){
    let nFrames=0, strikes=0, spares=0, opens=0, nGames=0;
    for(const g of gameRows){
      const s = DB.data.sessions.find(x=>x.id===g.sessionId);
      const d = s && s.gamesDetail && s.gamesDetail[g.gameNo-1];
      if(!d) continue; // 合計点のみの記録は率の対象外
      nGames++;
      nFrames += 10;
      strikes += d.strikes||0;
      spares  += d.spares||0;
      opens   += d.opens||0;
    }
    if(!nGames) return null;
    return {
      nGames,
      strikeRate: strikes/nFrames*100,
      spareRate: spares/nFrames*100,
      openRate: opens/nFrames*100,
      strikes, spares, opens, nFrames
    };
  }

  // 上達度
  let improvHtml;
  if(analysisMember==="all"){
    improvHtml = `<div class="small">個人の上達度を見るには、上のボタンでメンバーを選んでください。</div>`;
  }else{
    const n = target.length;
    const w = Math.min(5, Math.floor(n/2));
    if(n<6){
      improvHtml = `<div class="small">記録が ${n}G あります。6ゲーム以上で「初期→直近」の比較が表示されます。</div>`;
    }else{
      const ea = target.slice(0,w).reduce((a,g)=>a+g.score,0)/w;
      const la = target.slice(-w).reduce((a,g)=>a+g.score,0)/w;
      const diff = la-ea;
      const badge = diff>0?`<span class="badge-up">▲ +${fmt1(diff)} 上達!</span>`:diff<0?`<span class="badge-down">▼ ${fmt1(diff)}</span>`:`<span class="badge-flat">－ 横ばい</span>`;
      improvHtml = `
        <div class="row" style="text-align:center">
          <div class="stat"><div class="num">${fmt1(ea)}</div><div class="lbl">最初の${w}G平均</div></div>
          <div style="flex:0 0 auto;font-size:20px;color:var(--sub)">→</div>
          <div class="stat"><div class="num">${fmt1(la)}</div><div class="lbl">直近${w}G平均</div></div>
        </div>
        <div class="center" style="margin-top:10px">${badge}</div>`;
    }
  }

  // 会場別
  const byVenue = {};
  for(const g of target){
    (byVenue[g.venueId] = byVenue[g.venueId] || []).push(g);
  }
  const overallAvg = target.reduce((a,g)=>a+g.score,0)/target.length;
  const venueRows = Object.entries(byVenue).map(([vid,gs])=>{
    const avg = gs.reduce((a,g)=>a+g.score,0)/gs.length;
    const max = Math.max(...gs.map(g=>g.score));
    const min = Math.min(...gs.map(g=>g.score));
    let trend = null;
    if(gs.length>=6){
      const w = Math.min(3, Math.floor(gs.length/2));
      const e = gs.slice(0,w).reduce((a,g)=>a+g.score,0)/w;
      const l = gs.slice(-w).reduce((a,g)=>a+g.score,0)/w;
      trend = l-e;
    }
    const lastDate = gs[gs.length-1].date;
    // 会場別のストライク/スペア率
    const rates = calcRates(gs);
    return {vid, name:venueName(vid), n:gs.length, avg, max, min, trend, lastDate, rates};
  }).sort((a,b)=>b.avg-a.avg);

  const maxAvg = Math.max(...venueRows.map(v=>v.avg));

  // ストライク/スペア率(対象全体)
  const overallRates = calcRates(target);

  return `
  <div class="card">
    <h2>📈 ぶんせき — ${esc(label)}</h2>
    <div class="filter-row">${filterBtns}</div>
    <div class="grid3">
      <div class="stat"><div class="num">${target.length}</div><div class="lbl">ゲーム数</div></div>
      <div class="stat"><div class="num">${fmt1(overallAvg)}</div><div class="lbl">平均</div></div>
      <div class="stat"><div class="num">${Math.max(...target.map(g=>g.score))}</div><div class="lbl">ハイスコア</div></div>
    </div>
  </div>
  <div class="card">
    <h2>🚀 上達度</h2>
    ${improvHtml}
  </div>
  ${overallRates?`
  <div class="card">
    <h2>🎯 ストライク・スペア率</h2>
    <div class="small" style="margin-bottom:8px">フレーム入力で記録された ${overallRates.nGames}ゲーム / ${overallRates.nFrames}フレームが対象</div>
    <div class="grid3">
      <div class="stat"><div class="num" style="color:var(--accent)">${fmt1(overallRates.strikeRate)}<span style="font-size:14px">%</span></div><div class="lbl">ストライク率 (${overallRates.strikes}回)</div></div>
      <div class="stat"><div class="num" style="color:var(--success)">${fmt1(overallRates.spareRate)}<span style="font-size:14px">%</span></div><div class="lbl">スペア率 (${overallRates.spares}回)</div></div>
      <div class="stat"><div class="num" style="color:var(--danger)">${fmt1(overallRates.openRate)}<span style="font-size:14px">%</span></div><div class="lbl">オープン率 (${overallRates.opens}回)</div></div>
    </div>
    <div class="small" style="margin-top:8px">ストライク率・スペア率が上がるほど高スコアに直結します。オープンフレーム(ノーマーク)を減らすのが上達の近道です。</div>
  </div>`:""}
  <div class="card">
    <h2>📉 スコア推移</h2>
    <div class="small" style="margin-bottom:6px">実線: 各ゲーム / 太線: 5ゲーム移動平均</div>
    <div id="chart-trend"></div>
  </div>
  <div class="card">
    <h2>📍 会場別スコア傾向</h2>
    <div class="small" style="margin-bottom:10px">対象: ${esc(label)} — 会場ごとの平均の差で「相性」がわかります。</div>
    ${venueRows.map(v=>{
      const diff = v.avg-overallAvg;
      return `<div class="venue-card">
        <div class="head">
          <div class="name">📍 ${esc(v.name)}</div>
          <div class="avg">${fmt1(v.avg)}</div>
        </div>
        <div class="bar-outer"><div class="bar-inner" style="width:${Math.round(v.avg/maxAvg*100)}%"></div></div>
        <div class="small" style="margin-top:6px">
          ${v.n}G ・ 最高 ${v.max} / 最低 ${v.min} ・ 最終: ${esc(v.lastDate)}
          ・ 全体平均比 <span class="${diff>=0?"diff-pos":"diff-neg"}">${diff>=0?"+":""}${fmt1(diff)}</span>
          ${v.trend!==null?` ・ 会場内の伸び <span class="${v.trend>=0?"diff-pos":"diff-neg"}">${v.trend>=0?"+":""}${fmt1(v.trend)}</span>`:""}
        </div>
        ${v.rates?`<div class="small" style="margin-top:4px">
          🎯 ストライク率 <b style="color:var(--accent)">${fmt1(v.rates.strikeRate)}%</b>
          ・ スペア率 <b style="color:var(--success)">${fmt1(v.rates.spareRate)}%</b>
          <span style="color:var(--sub)">(${v.rates.nGames}G分)</span>
        </div>`:""}
      </div>`;
    }).join("")}
    <h3>会場別 平均比較</h3>
    <div id="chart-venue"></div>
  </div>`;
}

// ---------- SVG グラフ ----------
function drawCharts(){
  const games = allGames();
  const target = analysisMember==="all" ? games : games.filter(g=>g.memberId===analysisMember);

  // 推移グラフ
  const trendEl = $("#chart-trend");
  if(trendEl){
    if(target.length<2){
      trendEl.innerHTML = `<div class="empty">2ゲーム以上でグラフが表示されます。</div>`;
    }else{
      const W=600,H=240,P={l:38,r:12,t:14,b:30};
      const n=target.length;
      const scores=target.map(g=>g.score);
      let ymin=Math.min(...scores), ymax=Math.max(...scores);
      ymin=Math.max(0, Math.floor((ymin-15)/10)*10);
      ymax=Math.min(300, Math.ceil((ymax+15)/10)*10);
      const x=i=>P.l+(n===1?0:(W-P.l-P.r)*i/(n-1));
      const y=v=>P.t+(H-P.t-P.b)*(1-(v-ymin)/(ymax-ymin||1));
      const ma=scores.map((_,i)=>{
        const s=Math.max(0,i-4);
        const seg=scores.slice(s,i+1);
        return seg.reduce((a,b)=>a+b,0)/seg.length;
      });
      const pts=scores.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const mPts=ma.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const step=Math.max(1,Math.ceil(n/6));
      const labels=target.map((g,i)=> i%step===0?`<text x="${x(i)}" y="${H-8}" font-size="10" fill="#6b7280" text-anchor="middle">${g.date.slice(5).replace("-","/")}</text>`:"").join("");
      const grid=[ymin,(ymin+ymax)/2,ymax].map(v=>`
        <line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb" stroke-width="1"/>
        <text x="${P.l-6}" y="${y(v)+3}" font-size="10" fill="#6b7280" text-anchor="end">${Math.round(v)}</text>`).join("");
      const dots=scores.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="#1657c9"><title>${target[i].date} ${v}点 (${venueName(target[i].venueId)})</title></circle>`).join("");
      trendEl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
        ${grid}
        <polyline points="${pts}" fill="none" stroke="#9db8e8" stroke-width="2"/>
        <polyline points="${mPts}" fill="none" stroke="#ff6b1a" stroke-width="3.5" stroke-linejoin="round"/>
        ${dots}${labels}
      </svg>`;
    }
  }

  // 会場別バーチャート
  const vEl = $("#chart-venue");
  if(vEl){
    const byVenue={};
    for(const g of target) (byVenue[g.venueId]=byVenue[g.venueId]||[]).push(g);
    const rows=Object.entries(byVenue).map(([vid,gs])=>({name:venueName(vid), avg:gs.reduce((a,g)=>a+g.score,0)/gs.length, n:gs.length})).sort((a,b)=>b.avg-a.avg);
    if(!rows.length){ vEl.innerHTML=`<div class="empty">データがありません。</div>`; }
    else{
      const W=600, rowH=34, H=rows.length*rowH+10, P={l:150,r:60,t:6};
      const maxAvg=Math.max(...rows.map(r=>r.avg))*1.05;
      const bars=rows.map((r,i)=>{
        const y=P.t+i*rowH;
        const bw=(W-P.l-P.r)*(r.avg/maxAvg);
        return `<text x="${P.l-8}" y="${y+rowH/2+4}" font-size="12" fill="#111827" text-anchor="end">${esc(r.name.length>10?r.name.slice(0,10)+"…":r.name)}</text>
        <rect x="${P.l}" y="${y+5}" width="${bw.toFixed(1)}" height="${rowH-12}" rx="6" fill="url(#vgrad)"/>
        <text x="${P.l+bw+8}" y="${y+rowH/2+4}" font-size="12" font-weight="700" fill="#d97706">${fmt1(r.avg)} <tspan font-size="10" fill="#6b7280" font-weight="400">(${r.n}G)</tspan></text>`;
      }).join("");
      vEl.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
        <defs><linearGradient id="vgrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient></defs>
        ${bars}
      </svg>`;
    }
  }
}

  if(!v) return;
  const coupons = v.coupons||[];
  document.getElementById("app").insertAdjacentHTML("beforeend", `
    <div class="modal-back" id="venue-modal" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h2 style="margin-bottom:12px">📍 ${esc(v.name)}</h2>
        <label>料金(例: 1G 600円・貸靴 350円)</label>
        <input type="text" id="vi-price" value="${esc(v.price||"")}" placeholder="例: 平日1G 600円 / 貸靴 350円">
        <div style="margin-top:10px"><label>メモ(アクセス・駐車場・予約方法など)</label>
        <textarea id="vi-memo" rows="2" placeholder="例: 駅徒歩5分、大型駐車場あり">${esc(v.memo||"")}</textarea></div>
        <h3 style="margin-top:12px">🎟️ クーポン</h3>

        <button class="btn gray sm" onclick="addCouponRow()">＋ クーポンを追加</button>
        <div class="divider"></div>
        <div class="grid2">
          <button class="btn gray" onclick="document.getElementById('venue-modal').remove()">キャンセル</button>
          <button class="btn accent" onclick="saveVenueInfo('${id}')">保存</button>

function couponRowHtml(c,i){
  return `<div class="row" style="margin-bottom:6px" data-ci="${i}">
    <input type="text" class="cp-text" placeholder="内容(例: 1G無料)" value="${esc(c.text||"")}" style="flex:1.4">
    <input type="date" class="cp-exp" value="${esc(c.exp||"")}" style="flex:1">
    <button class="rm" type="button" onclick="this.closest('.row').remove()" style="flex:0 0 auto;border:none;background:#f3f4f6;color:var(--danger);border-radius:8px;width:36px;height:36px;cursor:pointer">✕</button>
  </div>`;
}
function addCouponRow(){
  document.getElementById("vi-coupons").insertAdjacentHTML("beforeend", couponRowHtml({},Date.now()));
}
async function saveVenueInfo(id){
  const price = document.getElementById("vi-price").value.trim();
  const memo = document.getElementById("vi-memo").value.trim();
  const coupons = [...document.querySelectorAll("#vi-coupons .row")].map(r=>({
    text: r.querySelector(".cp-text").value.trim(),
    exp: r.querySelector(".cp-exp").value
  })).filter(c=>c.text);
  await fsSet("venues", id, {price, memo, coupons});
  document.getElementById("venue-modal").remove();
  render();
}

// 期限の近い/切れたクーポンを集める(全体会場)
function collectCoupons(){
  const out = [];
  const today = todayStr();
  for(const v of DB.data.venues){
    for(const c of (v.coupons||[])){
      let status = "ok";
      if(c.exp){
        const diff = Math.round((new Date(c.exp) - new Date(today)) / 86400000);
        if(diff < 0) status = "expired";
        else if(diff <= 14) status = "soon";
      }
      out.push({venue: v.name, text: c.text, exp: c.exp, status});
    }
  }
  // 期限切れ→期限近い→その他 の順
  const rank = {expired:0, soon:1, ok:2};
  out.sort((a,b)=> rank[a.status]-rank[b.status] || (a.exp||"9999").localeCompare(b.exp||"9999"));
  return out;
}

// ---------- エクスポート / インポート ----------
function downloadFile(name, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function exportJSON(){
  downloadFile(`bowling-practice-${todayStr()}.json`, JSON.stringify(DB.data,null,2), "application/json");
}
function exportCSV(){
  const rows = [["日付","メンバー","会場","ゲーム","スコア","メモ"]];
  const sessions = DB.data.sessions.slice().sort((a,b)=> a.date<b.date?-1:1);
  for(const s of sessions){
    (s.games||[]).forEach((g,i)=>{
      if(g===null||g==="") return;
      rows.push([s.date, memberName(s.memberId), venueName(s.venueId), i+1, g, (s.memo||"").replace(/"/g,'""')]);
    });
  }
  const csv = "﻿" + rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?`"${c}"`:c).join(",")).join("\n");
  downloadFile(`bowling-practice-${todayStr()}.csv`, csv, "text/csv");
}
function importJSON(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d.members || !d.venues || !d.sessions) throw new Error("bad format");
      if(!confirm(`バックアップの内容(${d.members.length}名・${d.venues.length}会場・${d.sessions.length}件)を追加します。よろしいですか?`)) return;
      // id参照を保ったまま取り込む(クラウド時は新旧idを対応付け)
      const items = [];
      const memberMap = {}, venueMap = {};
      for(const m of d.members){
        const echo = {};
        memberMap[m.id] = echo;
        items.push({coll:"members", data:{name:m.name, createdAt:m.createdAt||Date.now()}, localEcho:echo});
      }
      for(const v of d.venues){
        const echo = {};
        venueMap[v.id] = echo;
        items.push({coll:"venues", data:{name:v.name, createdAt:v.createdAt||Date.now()}, localEcho:echo});
      }
      await fsBatchAdd(items);
      const sItems = d.sessions.map(s=>({coll:"sessions", data:{
        date:s.date,
        memberId: Sync.mode==="cloud" ? (memberMap[s.memberId]||{}).id : s.memberId,
        venueId:  Sync.mode==="cloud" ? (venueMap[s.venueId]||{}).id : s.venueId,
        games:s.games||[], memo:s.memo||"", createdAt:s.createdAt||Date.now()
      }}));
      await fsBatchAdd(sItems);
      if(Sync.mode==="local"){ render(); }
      alert("取り込みました");
    }catch(e){ console.error(e); alert("読み込めませんでした。正しいバックアップファイルか確認してください。"); }
  };
  r.readAsText(f);
}
async function wipeAll(){
  if(!confirm("全ての記録・メンバー・会場を削除します。本当によろしいですか?")) return;
  if(!confirm(Sync.mode==="cloud" ? "クラウド上の共有データが全員分消えます。本当に削除します。" : "この操作は元に戻せません。本当に削除しますか?")) return;
  if(Sync.mode==="cloud"){
    for(const coll of ["members","venues","sessions","plans"]){
      const snap = await Sync.fs.getDocs(Sync.fs.collection(Sync.db, coll));
      const docs = snap.docs;
      for(let i=0;i<docs.length;i+=450){
        const b = Sync.fs.writeBatch(Sync.db);
        docs.slice(i,i+450).forEach(d=>b.delete(d.ref));
        await b.commit();
      }
    }
  }
  DB.data = {members:[],venues:[],sessions:[],plans:[]};
  DB.save(); analysisMember="all"; render();
}
async function loadSample(){
  if(DB.data.sessions.length && !confirm("既存の記録があります。サンプルデータを追加しますか?")) return;
  const memEcho = [0,1,2,3].map(()=>({}));
  const venEcho = [0,1,2].map(()=>({}));
  const names = ["山田","田中","佐藤","鈴木"];
  const venues = ["セントラルボウル","みなとレーン","グリーンアローボウル"];
  const items = [];
  names.forEach((n,i)=> items.push({coll:"members", data:{name:n, createdAt:Date.now()}, localEcho:memEcho[i]}));
  venues.forEach((n,i)=> items.push({coll:"venues", data:{name:n, createdAt:Date.now()}, localEcho:venEcho[i]}));
  await fsBatchAdd(items);
  const memIds = Sync.mode==="cloud" ? memEcho.map(e=>e.id) : DB.data.members.slice(-4).map(m=>m.id);
  const venIds = Sync.mode==="cloud" ? venEcho.map(e=>e.id) : DB.data.venues.slice(-3).map(v=>v.id);
  const base = {0:150,1:135,2:120,3:165};
  const vmod = {0:8, 1:-6, 2:0};
  const rnd = seed => { let x=seed; return ()=>{ x=(x*1103515245+12345)&0x7fffffff; return x/0x7fffffff; }; };
  const rand = rnd(42);
  const today = new Date();
  const sItems = [];
  for(let w=10; w>=1; w--){
    for(let mi=0; mi<4; mi++){
      if(rand()<0.25) continue;
      const d = new Date(today); d.setDate(d.getDate()-w*7+Math.floor(rand()*3));
      const date = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      const vi = Math.floor(rand()*3);
      const growth = (10-w)*1.1;
      const games = [];
      const gN = 2+Math.floor(rand()*3);
      for(let g=0; g<gN; g++){
        const v = Math.round(base[mi] + vmod[vi] + growth + (rand()-0.5)*36 + g*3);
        games.push(Math.max(60, Math.min(280, v)));
      }
      // 直近3週はフレーム詳細つきで生成(ストライク/スペア率のデモ用)
      const data = {date, memberId:memIds[mi], venueId:venIds[vi], games, memo:"", createdAt:d.getTime()+gN};
      if(w<=3){
        data.gamesDetail = games.map(score=>{
          // スコアに見合うストライク/スペア数をざっくり推定してデモデータ化
          const st = Math.max(0, Math.round((score-110)/30 + (rand()-0.5)*2));
          const sp = Math.max(0, Math.min(10-st, Math.round((score-100)/25 + (rand()-0.5)*2)));
          const op = 10 - st - sp;
          return {score, strikes:st, spares:sp, opens:op, frames:[]};
        });
      }
      sItems.push({coll:"sessions", data});
    }
  }
  await fsBatchAdd(sItems);
  if(Sync.mode==="local") render();
}
